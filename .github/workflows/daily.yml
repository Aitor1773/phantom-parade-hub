# Actualización diaria de la web: datos (wiki, banners, códigos, foro), imágenes los lunes,
# compilación de prueba y guardado de los cambios en el repositorio. Cloudflare Pages está
# conectado al repositorio y publica la web sola con cada subida a main.
# Guía para activarlo: docs/PUBLICAR.md
name: Actualización diaria

on:
  schedule:
    # 06:30 UTC = 15:30 JST, justo después del cambio diario de banners (15:00 JST)
    - cron: '30 6 * * *'
  workflow_dispatch: # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write # guardar los datos actualizados
  discussions: read # leer el foro (Giscus)

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_URL: https://phantom-parade-hub.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Personajes y memorias (wiki)
        run: npm run data:fetch

      - name: Banners y eventos
        run: npm run data:banners

      - name: Códigos
        run: npm run data:codes
        continue-on-error: true # si una web de códigos falla, se sigue con lo demás

      - name: Emparejar memorias con jjkppdb
        run: npm run data:link
        continue-on-error: true

      - name: Tier list (personajes nuevos como borrador)
        run: npm run data:tierdraft

      - name: Foro de la comunidad
        run: npm run data:community
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Eventos en curso (equipo recomendado)
        run: npm run data:events
        continue-on-error: true # si la fuente falla, se conservan los datos de ayer

      - name: Imágenes oficiales de los banners abiertos
        run: npm run data:banner-art
        continue-on-error: true

      - name: Mejores equipos (hoja de la comunidad)
        run: npm run data:best-teams
        continue-on-error: true # si la hoja o sus imágenes fallan, se conservan los equipos de ayer

      - name: Día de la semana
        id: dow
        run: echo "n=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Caché de originales de jjkppdb
        uses: actions/cache@v4
        with:
          path: assets-src
          key: jjkppdb-${{ github.run_id }}
          restore-keys: jjkppdb-

      - name: Imágenes nuevas (lunes o lanzamiento manual)
        if: steps.dow.outputs.n == '1' || github.event_name == 'workflow_dispatch'
        run: npm run images:fetch && npm run images
        continue-on-error: true

      - name: Compilar
        run: npm run build

      - name: Guardar los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # La fecha de la comprobación hace que siempre haya subida, y con ella una
          # publicación nueva (fechas de «disponible ahora» y estimaciones al día)
          date -u +%FT%TZ > data/last-run.txt
          git add data src/data public/img
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: actualización diaria $(date -u +%F)"
            git push
          fi
